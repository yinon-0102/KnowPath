services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: keel_learning
      MYSQL_USER: keel
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 infra/.env 配置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 infra/.env 配置 MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - keel_mysql:/var/lib/mysql

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请在 infra/.env 配置 NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - keel_neo4j:/data

  qdrant:
    image: qdrant/qdrant:v1.13.6
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?请在 infra/.env 配置 QDRANT_API_KEY}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - keel_qdrant:/qdrant/storage

  minio:
    image: knowpath/minio:2025-10-15
    build:
      context: ./minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在 infra/.env 配置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 infra/.env 配置 MINIO_ROOT_PASSWORD}
    command: server /data --console-address :9001
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - keel_minio:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  minio-init:
    image: knowpath/minio:2025-10-15
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请配置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请配置 MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-knowpath-materials}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
    restart: "no"

volumes:
  keel_mysql:
  keel_neo4j:
  keel_qdrant:
  keel_minio:
